[package]
name = "lexe_events"
description = "lexe Module events"
version = "0.1.8"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_events"
path = "src/lib.rs"

[dependencies]
lexe_utils = { version = "0.1.8", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
tracing = { version = "0.1", default-features = false }
