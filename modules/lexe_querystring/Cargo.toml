[package]
name = "lexe_querystring"
description = "lexe Module querystring"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_querystring"
path = "src/lib.rs"

[dependencies]
lexe_utils = { version = "0.1.1", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }
