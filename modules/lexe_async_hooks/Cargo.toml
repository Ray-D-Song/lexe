[package]
name = "lexe_async_hooks"
description = "lexe Module async_hooks"
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_async_hooks"
path = "src/lib.rs"

[dependencies]
lexe_hooking = { version = "0.1.6", path = "../../libs/lexe_hooking" }
lexe_utils = { version = "0.1.6", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
tracing = { version = "0.1", default-features = false }
