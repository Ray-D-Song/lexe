[package]
name = "lexe_timers"
description = "lexe Module timers"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_timers"
path = "src/lib.rs"

[dependencies]
lexe_context = { version = "0.1.4", path = "../../libs/lexe_context" }
lexe_hooking = { version = "0.1.4", path = "../../libs/lexe_hooking" }
lexe_utils = { version = "0.1.4", path = "../../libs/lexe_utils", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
tokio = { version = "1", features = [
  "macros",
  "sync",
  "time",
], default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["macros", "rt"], default-features = false }
