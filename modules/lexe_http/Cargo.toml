[package]
name = "lexe_http"
description = "lexe Module http & https"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_http"
path = "src/lib.rs"

[features]
default = ["http1", "http2", "webpki-roots", "tls-ring"]

http1 = ["hyper/http1", "hyper-rustls?/http1", "hyper-util/http1"]
http2 = ["hyper/http2", "hyper-rustls?/http2", "hyper-util/http2"]

webpki-roots = ["lexe_tls/webpki-roots"]
native-roots = ["lexe_tls/native-roots"]

# TLS crypto backend features (rustls-based)
tls-ring = [
  "http1",
  "lexe_tls/tls-ring",
  "dep:hyper-rustls",
  "hyper-rustls/ring",
  "dep:rustls",
]
tls-aws-lc = [
  "http1",
  "lexe_tls/tls-aws-lc",
  "dep:hyper-rustls",
  "hyper-rustls/aws-lc-rs",
  "dep:rustls",
]
tls-graviola = [
  "http1",
  "lexe_tls/tls-graviola",
  "dep:hyper-rustls",
  "dep:rustls",
]

# OpenSSL TLS backend
tls-openssl = [
  "http1",
  "lexe_tls/tls-openssl",
  "dep:hyper-openssl",
  "dep:openssl",
]

[dependencies]
bytes = { version = "1", default-features = false }
fastwebsockets = { version = "0.10", default-features = false, features = [
  "upgrade",
  "simdutf8",
  "base64",
  "sha1",
] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
sha1 = { version = "0.10", default-features = false }
getrandom = { version = "0.3", default-features = false }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", features = ["client", "server", "http1"], default-features = false }
hyper-util = { version = "0.1", features = [
  "client-legacy",
  "server",
  "tokio",
], default-features = false }
hyper-rustls = { version = "0.27", default-features = false, optional = true }
hyper-openssl = { version = "0.10", features = [
  "client-legacy",
], optional = true }
openssl = { version = "0.10", optional = true }
lexe_async_hooks = { version = "0.1.0", path = "../lexe_async_hooks" }
lexe_dns_cache = { version = "0.1.0", path = "../../libs/lexe_dns_cache" }
lexe_tls = { version = "0.1.0", default-features = false, path = "../lexe_tls" }
lexe_timers = { version = "0.1.0", path = "../lexe_timers" }
lexe_utils = { version = "0.1.0", path = "../../libs/lexe_utils", default-features = false }
lexe_context = { version = "0.1.0", path = "../../libs/lexe_context" }
lexe_events = { version = "0.1.0", path = "../lexe_events" }
lexe_buffer = { version = "0.1.0", path = "../lexe_buffer" }
lexe_net = { version = "0.1.0", path = "../lexe_net" }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { version = "=0.12.1", features = [
  "either",
  "std",
], default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], default-features = false }
tokio-stream = { version = "0.1", features = ["sync"], default-features = false }
rustls = { version = "0.23", features = [
  "tls12",
], default-features = false, optional = true }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
lexe_test_tls = { path = "../../libs/lexe_test_tls", features = ["tls-ring"] }
lexe_net = { path = "../lexe_net" }
lexe_tls = { path = "../lexe_tls", features = ["tls-ring"] }
rustls = { version = "0.23", features = ["std", "tls12", "ring"], default-features = false }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false }
