[package]
name = "lexe_sqlite"
description = "lexe Module node:sqlite"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_sqlite"
path = "src/lib.rs"

[dependencies]
lexe_buffer = { version = "0.1.1", path = "../lexe_buffer" }
lexe_context = { version = "0.1.1", path = "../../libs/lexe_context" }
lexe_url = { version = "0.1.1", path = "../lexe_url" }
lexe_process = { version = "0.1.1", path = "../lexe_process", default-features = false }
lexe_utils = { version = "0.1.1", path = "../../libs/lexe_utils", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { version = "=0.12.1", features = ["either"], default-features = false }
tokio = { version = "1", features = ["rt", "sync"], default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[build-dependencies]
cc = "1"

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["macros", "rt"] }
