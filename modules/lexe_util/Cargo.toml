[package]
name = "lexe_util"
description = "lexe Module util"
version = "0.1.10"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_util"
path = "src/lib.rs"

[dependencies]
lexe_context = { version = "0.1.10", path = "../../libs/lexe_context" }
lexe_encoding = { version = "0.1.10", path = "../../libs/lexe_encoding" }
lexe_logging = { version = "0.1.10", path = "../../libs/lexe_logging" }
lexe_utils = { version = "0.1.10", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
rquickjs = { version = "=0.12.1", features = ["futures"], default-features = false }
tokio = { version = "1", features = ["macros", "rt"], default-features = false }
