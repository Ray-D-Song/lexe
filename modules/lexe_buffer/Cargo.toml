[package]
name = "lexe_buffer"
description = "lexe Module buffer"
version = "0.1.11"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_buffer"
path = "src/lib.rs"

[dependencies]
lexe_encoding = { version = "0.1.11", path = "../../libs/lexe_encoding" }
lexe_events = { version = "0.1.11", path = "../lexe_events" }
lexe_exceptions = { version = "0.1.11", path = "../lexe_exceptions" }
lexe_utils = { version = "0.1.11", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = [
  "futures",
], default-features = false }

[build-dependencies]
rquickjs = { version = "=0.12.1", default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["full"], default-features = false }
