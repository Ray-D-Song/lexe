[package]
name = "lexe_url"
description = "lexe Module url"
version = "0.1.10"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_url"
path = "src/lib.rs"

[dependencies]
idna = { version = "1", features = ["std", "compiled_data"], default-features = false }
lexe_utils = { version = "0.1.10", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
url = { version = "2", features = ["std"], default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["test-util"], default-features = false }
