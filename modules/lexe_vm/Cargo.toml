[package]
name = "lexe_vm"
description = "lexe Module vm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_vm"
path = "src/lib.rs"

[dependencies]
lexe_utils = { version = "0.1.0", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["macros", "rt"] }
