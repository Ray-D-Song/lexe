[package]
name = "lexe_console"
description = "lexe Module console"
version = "0.1.9"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_console"
path = "src/lib.rs"

[dependencies]
lexe_logging = { version = "0.1.9", path = "../../libs/lexe_logging" }
lexe_utils = { version = "0.1.9", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
