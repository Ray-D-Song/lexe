[package]
name = "lexe_worker_threads"
description = "lexe worker_threads native support"
version = "0.1.7"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "lexe_worker_threads"
path = "src/lib.rs"

[dependencies]
lexe_context = { version = "0.1.7", path = "../../libs/lexe_context" }
lexe_utils = { version = "0.1.7", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }
tokio = { version = "1", features = ["sync"], default-features = false }
tracing = { version = "0.1", default-features = false }
