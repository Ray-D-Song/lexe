[package]
name = "lexe_stream"
description = "lexe Module stream"
version = "0.1.9"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_stream"
path = "src/lib.rs"

[dependencies]
lexe_buffer = { version = "0.1.9", path = "../lexe_buffer" }
lexe_context = { version = "0.1.9", path = "../../libs/lexe_context" }
lexe_events = { version = "0.1.9", path = "../lexe_events" }
lexe_utils = { version = "0.1.9", path = "../../libs/lexe_utils", features = [
  "bytearray-buffer",
], default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }
tokio = { version = "1", features = [
  "macros",
  "io-util",
], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util", "time"], default-features = false }
