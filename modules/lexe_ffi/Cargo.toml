[package]
name = "lexe_ffi"
description = "lexe Module node:ffi"
version = "0.1.7"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_ffi"
path = "src/lib.rs"

[dependencies]
lexe_utils = { version = "0.1.7", path = "../../libs/lexe_utils", default-features = false }
libffi = "5.2"
libloading = { version = "0.8", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }

[dev-dependencies]
lexe_buffer = { path = "../lexe_buffer" }
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["macros", "rt"] }
