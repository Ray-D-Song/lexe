[package]
name = "lexe_process"
description = "lexe Module process"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[features]
default = []
napi = ["dep:lexe_napi"]

[lib]
name = "lexe_process"
path = "src/lib.rs"

[dependencies]
lexe_events = { version = "0.1.2", path = "../lexe_events" }
lexe_hooking = { version = "0.1.2", path = "../../libs/lexe_hooking" }
lexe_tty = { version = "0.1.2", path = "../lexe_tty" }
lexe_utils = { version = "0.1.2", path = "../../libs/lexe_utils", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }
lexe_napi = { version = "0.1.2", path = "../lexe_napi", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["macros", "rt", "test-util"], default-features = false }
