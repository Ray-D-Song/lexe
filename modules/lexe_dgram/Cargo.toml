[package]
name = "lexe_dgram"
description = "lexe Module dgram"
version = "0.1.10"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_dgram"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
lexe_buffer = { version = "0.1.10", path = "../lexe_buffer" }
lexe_context = { version = "0.1.10", path = "../../libs/lexe_context" }
lexe_events = { version = "0.1.10", path = "../lexe_events" }
lexe_utils = { version = "0.1.10", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
socket2 = { version = "0.6", default-features = false }
tokio = { version = "1", features = [
    "net",
    "macros",
], default-features = false }
tracing = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["rt", "macros"] }
