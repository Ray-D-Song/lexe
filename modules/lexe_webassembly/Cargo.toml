[package]
name = "lexe_webassembly"
description = "lexe core WebAssembly JS API (WebAssembly.compile/instantiate/validate, Module/Instance/Memory/Table/Global) and node:wasi backed by wasmz"
version = "0.1.9"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_webassembly"
path = "src/lib.rs"

[dependencies]
lexe_utils = { version = "0.1.9", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["loader", "std"], default-features = false }
wasmparser = { version = "=0.239.0", default-features = false, features = ["validate", "features", "std", "simd"] }
wasmz = { git = "https://github.com/Ray-D-Song/wasmz.git", tag = "v0.1.7" }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["macros", "rt"] }
# `wat` is only ever used from `#[cfg(test)]` code to author small binary fixtures
# inline in Rust unit tests. It is never enabled for the production build of this
# crate (see the plan constraint: "生产代码不启用 wat").
wat = "1"
