[package]
name = "lexe_tty"
description = "lexe Module tty"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_tty"
path = "src/lib.rs"

[dependencies]
lexe_buffer = { version = "0.1.4", path = "../lexe_buffer" }
lexe_context = { version = "0.1.4", path = "../../libs/lexe_context" }
lexe_events = { version = "0.1.4", path = "../lexe_events" }
lexe_utils = { version = "0.1.4", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }
libc = { version = "0.2", default-features = false }
tokio = { version = "1", features = ["sync"], default-features = false }
tracing = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["signal"], default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossterm = { version = "0.29", features = ["events", "windows"], default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
tokio = { version = "1", features = ["test-util", "macros", "rt"], default-features = false }
