[package]
name = "lexe_perf_hooks"
description = "lexe Module perf_hooks"
version = "0.1.11"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_perf_hooks"
path = "src/lib.rs"

[dependencies]
lexe_events = { version = "0.1.11", path = "../lexe_events" }
lexe_utils = { version = "0.1.11", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }

[dev-dependencies]
lexe_test = { path = "../../libs/lexe_test" }
