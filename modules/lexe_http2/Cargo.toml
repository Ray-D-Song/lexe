[package]
name = "lexe_http2"
description = "lexe Module http2"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_http2"
path = "src/lib.rs"

[features]
default = ["tls-ring"]
tls-ring = ["lexe_tls/tls-ring"]
tls-aws-lc = ["lexe_tls/tls-aws-lc"]
tls-graviola = ["lexe_tls/tls-graviola"]
tls-openssl = ["lexe_tls/tls-openssl"]

[dependencies]
bytes = { version = "1", default-features = false }
http = "1"
http-body-util = { version = "0.1", default-features = false }
h2 = "0.4"
hyper = { version = "1", features = ["client", "http2"], default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "tokio", "http2"], default-features = false }
lexe_buffer = { version = "0.1.2", path = "../lexe_buffer" }
lexe_context = { version = "0.1.2", path = "../../libs/lexe_context" }
lexe_events = { version = "0.1.2", path = "../lexe_events" }
lexe_tls = { version = "0.1.2", default-features = false, path = "../lexe_tls" }
lexe_timers = { version = "0.1.2", path = "../lexe_timers" }
lexe_utils = { version = "0.1.2", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["either", "std"], default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }

[dev-dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
lexe_async_hooks = { path = "../lexe_async_hooks" }
lexe_test = { path = "../../libs/lexe_test" }
lexe_test_tls = { path = "../../libs/lexe_test_tls", features = ["tls-ring"] }
rustls = { version = "0.23", features = ["std", "tls12", "ring"], default-features = false }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false }
