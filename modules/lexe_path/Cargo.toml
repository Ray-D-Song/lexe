[package]
name = "lexe_path"
description = "lexe Module path"
version = "0.1.8"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_path"
path = "src/lib.rs"

[dependencies]
lexe_utils = { version = "0.1.8", path = "../../libs/lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }

[target.'cfg(windows)'.dependencies]
memchr = { version = "2", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
rand = { version = "0.10.1", features = [
  "alloc",
  "thread_rng",
], default-features = false }

[[bench]]
name = "slash_replacement"
harness = false
