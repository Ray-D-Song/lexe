[package]
name = "lexe_dns_cache"
description = "lexe dns cache helpers"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"
readme = "README.md"

[lib]
name = "lexe_dns_cache"
path = "src/lib.rs"

[dependencies]
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
], default-features = false }
lexe_context = { version = "0.1.1", path = "../lexe_context" }
lexe_utils = { version = "0.1.1", path = "../lexe_utils", default-features = false }
tokio = { version = "1", features = ["net"], default-features = false }
tower-service = { version = "0.3", default-features = false }
quick_cache = { version = "0.6", default-features = false }
