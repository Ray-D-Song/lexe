[package]
name = "lexe_numbers"
description = "lexe numbers helpers"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_numbers"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
lexe_utils = { version = "0.1.1", path = "../lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
ryu = { version = "1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
lexe_test = { version = "0.1.1", path = "../lexe_test" }
rand = { version = "0.10.1", features = ["alloc"], default-features = false }

[[bench]]
name = "numbers"
harness = false
