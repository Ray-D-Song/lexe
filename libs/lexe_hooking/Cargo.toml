[package]
name = "lexe_hooking"
description = "lexe hooking helpers"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_hooking"
path = "src/lib.rs"

[dependencies]
lexe_utils = { version = "0.1.2", path = "../../libs/lexe_utils", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
