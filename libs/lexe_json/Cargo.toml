[package]
name = "lexe_json"
description = "lexe json helpers"
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_json"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
lexe_utils = { version = "0.1.5", path = "../lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
ryu = { version = "1", default-features = false }
simd-json = { version = "0.17", features = [
    "big-int-as-float",
], default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
lexe_test = { version = "0.1.5", path = "../lexe_test" }
tokio = { version = "1", features = ["test-util"], default-features = false }

[build-dependencies]
lexe_build = { version = "0.1.5", path = "../lexe_build" }

[[bench]]
name = "json"
harness = false
