[package]
name = "lexe_logging"
description = "lexe logging helpers"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/lexe"

[lib]
name = "lexe_logging"
path = "src/lib.rs"

[dependencies]
itoa = { version = "1", default-features = false }
lexe_context = { version = "0.1.3", path = "../lexe_context" }
lexe_encoding = { version = "0.1.3", path = "../lexe_encoding" }
lexe_json = { version = "0.1.3", path = "../lexe_json" }
lexe_numbers = { version = "0.1.3", path = "../lexe_numbers" }
lexe_utils = { version = "0.1.3", path = "../lexe_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
ryu = { version = "1", default-features = false }
