[workspace]
resolver = "2"

members = [
  "libs/lexe_build",
  "libs/lexe_compression",
  "libs/lexe_context",
  "libs/lexe_encoding",
  "libs/lexe_json",
  "libs/lexe_numbers",
  "libs/lexe_test",
  "libs/lexe_test_tls",
  "libs/lexe_utils",
  "v8_compat",
  "modules/lexe_abort",
  "modules/lexe_async_hooks",
  "modules/lexe_buffer",
  "modules/lexe_child_process",
  "modules/lexe_console",
  "modules/lexe_constants",
  "modules/lexe_crypto",
  "modules/lexe_dgram",
  "modules/lexe_querystring",
  "modules/lexe_diagnostics_channel",
  "modules/lexe_events",
  "modules/lexe_exceptions",
  "modules/lexe_fetch",
  "modules/lexe_ffi",
  "modules/lexe_fs",
  "modules/lexe_http",
  "modules/lexe_http2",
  "modules/lexe_inspector",
  "modules/lexe_intl",
  "modules/lexe_napi",
  "modules/lexe_navigator",
  "modules/lexe_net",
  "modules/lexe_os",
  "modules/lexe_path",
  "modules/lexe_perf_hooks",
  "modules/lexe_process",
  "modules/lexe_sea",
  "modules/lexe_sqlite",
  "modules/lexe_stream",
  "modules/lexe_stream_web",
  "modules/lexe_string_decoder",
  "modules/lexe_temporal",
  "modules/lexe_timers",
  "modules/lexe_tls",
  "modules/lexe_tty",
  "modules/lexe_url",
  "modules/lexe_util",
  "modules/lexe_v8",
  "modules/lexe_vm",
  "modules/lexe_webassembly",
  "modules/lexe_zlib",
  "modules/lexe_worker_threads",
  "lexe_modules",
  "lexe_core",
  "lexe",
]

[profile.flame]
inherits = "release"
strip = false
debug = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

# Proc-macros are dlopen'd by rustc; release strip breaks rquickjs_macro loading.
[profile.release.package.rquickjs-macro]
strip = false

[profile.test]
opt-level = 3

[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
