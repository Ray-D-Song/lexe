name: Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Keeps refs/heads/main's rust-cache fresh and runs the full cross-platform
  # matrix (including macOS and ARM64) on merge.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case_filter:
        description: Run cases whose names contain this keyword (empty runs all)
        required: false
        type: string
        default: ""

concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      core: ${{ steps.scope.outputs.core }}
      rust: ${{ steps.scope.outputs.rust }}
      v8: ${{ steps.scope.outputs.v8 }}
      sqlite: ${{ steps.scope.outputs.sqlite }}
      napi: ${{ steps.scope.outputs.napi }}
      windows_crates: ${{ steps.scope.outputs.windows_crates }}
      db_compat: ${{ steps.scope.outputs.db_compat }}
      next_compat: ${{ steps.scope.outputs.next_compat }}
      linux_matrix: ${{ steps.scope.outputs.linux_matrix }}
      has_linux_compat: ${{ steps.scope.outputs.has_linux_compat }}
    steps:
      - uses: actions/checkout@v4
      # paths-filter needs a git checkout for non-PR events (it diffs against a
      # base ref); skipping it made workflow_dispatch runs die here.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            core:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'Makefile'
              - 'build.mjs'
              - 'index.mjs'
              - 'bundle/**'
              - 'compat/**'
              - 'modules/**'
              - 'libs/**'
              - 'lexe/**'
              - 'lexe_core/**'
              - 'lexe_modules/**'
              - 'prebuild/**'
              - 'v8_compat/**'
              - 'vendor/**'
              - 'refs/**'
              - 'linker/**'
              - 'tests/**'
              - 'scripts/**'
              - 'docs/compatibility.md'
              - 'fixtures/**'
              - '**/*.ts'
              - '**/*.mjs'
              - 'yarn.lock'
              - 'package.json'
              - 'tsconfig.json'
              - '.github/workflows/**'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'vendor/**'
              - 'linker/**'
              - '.github/workflows/compat.yml'
            v8:
              - 'v8_compat/**'
              - 'refs/node'
              - 'modules/lexe_napi/**'
              - 'lexe/Cargo.toml'
              - 'lexe/src/**'
              - 'lexe/build.rs'
              - 'compat/v8-hello/**'
              - 'compat/better-sqlite3/**'
              - 'Cargo.lock'
              - '.github/workflows/compat.yml'
            sqlite:
              - 'modules/lexe_sqlite/**'
              - 'compat/node-sqlite/**'
              - 'tests/unit/sqlite*'
              - 'libs/**'
              - 'lexe_core/**'
              - 'Cargo.lock'
              - '.github/workflows/compat.yml'
            napi:
              - 'modules/lexe_napi/**'
              - 'compat/napi-hello/**'
              - 'compat/vite-plus/**'
              - 'libs/**'
              - 'lexe_core/**'
              - 'lexe/src/**'
              - '.github/workflows/compat.yml'
            windows_crates:
              - 'modules/lexe_tty/**'
              - 'modules/lexe_napi/**'
              - 'modules/lexe_fs/**'
              - 'libs/**'
              - 'lexe/**'
              - 'lexe_core/**'
              - '.github/workflows/compat.yml'
            db_compat:
              - 'modules/lexe_net/**'
              - 'modules/lexe_tls/**'
              - 'modules/lexe_crypto/**'
              - 'modules/lexe_stream*/**'
              - 'modules/lexe_buffer/**'
              - 'modules/lexe_events/**'
              - 'modules/lexe_timers/**'
              - 'libs/**'
              - 'lexe_core/**'
              - 'lexe_modules/**'
              - 'lexe/**'
              - 'compat/mysql2/**'
              - 'compat/node-postgres/**'
              - '.github/workflows/compat.yml'
            next_compat:
              - 'modules/lexe_http*/**'
              - 'modules/lexe_net/**'
              - 'modules/lexe_fs/**'
              - 'modules/lexe_url/**'
              - 'modules/lexe_stream*/**'
              - 'modules/lexe_zlib/**'
              - 'modules/lexe_buffer/**'
              - 'modules/lexe_process/**'
              - 'modules/lexe_path/**'
              - 'libs/**'
              - 'lexe_core/**'
              - 'lexe_modules/**'
              - 'lexe/**'
              - 'compat/next/**'
              - '.github/workflows/compat.yml'
      # Non-PR events (push to main, manual dispatch) or PRs labeled `ci:full`
      # run the full cross-platform and sanitizer matrix.
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          CASE_FILTER: ${{ inputs.case_filter }}
          F_CORE: ${{ steps.filter.outputs.core }}
          F_RUST: ${{ steps.filter.outputs.rust }}
          F_V8: ${{ steps.filter.outputs.v8 }}
          F_SQLITE: ${{ steps.filter.outputs.sqlite }}
          F_NAPI: ${{ steps.filter.outputs.napi }}
          F_WIN: ${{ steps.filter.outputs.windows_crates }}
          F_DB: ${{ steps.filter.outputs.db_compat }}
          F_NEXT: ${{ steps.filter.outputs.next_compat }}
        run: |
          python3 - << 'PY'
          import json, os

          event_name = os.environ["EVENT_NAME"]
          has_full_label = os.environ["HAS_FULL_LABEL"] == "true"
          full = (event_name != "pull_request") or has_full_label
          case_filter = os.environ.get("CASE_FILTER", "")

          def flag(env_key):
              return full or (os.environ.get(env_key) == "true")

          flags = {
              "full": full,
              "core": flag("F_CORE"),
              "rust": flag("F_RUST"),
              "v8": flag("F_V8"),
              "sqlite": flag("F_SQLITE"),
              "napi": flag("F_NAPI"),
              "windows_crates": flag("F_WIN"),
              "db_compat": flag("F_DB"),
              "next_compat": flag("F_NEXT"),
          }

          linux_cases = []
          if flags["core"]:
              linux_cases.append({"case": "api-surface", "node": "24.3.0"})
          if flags["db_compat"]:
              linux_cases.append({"case": "mysql2", "node": "22.18.0"})
              linux_cases.append({"case": "node-postgres", "node": "22.18.0"})
          if flags["next_compat"]:
              linux_cases.append({"case": "next", "node": "22.18.0"})
          if flags["napi"]:
              linux_cases.append({"case": "vite-plus", "node": "22.18.0"})
          if flags["sqlite"]:
              linux_cases.append({"case": "node-sqlite", "node": "24.3.0"})
          if flags["v8"]:
              linux_cases.append({"case": "better-sqlite3", "node": "24.3.0"})
              linux_cases.append({"case": "v8-hello", "node": "24.3.0"})

          if event_name == "workflow_dispatch" and case_filter:
              alias_map = {
                  "mysql2": "mysql-compat",
                  "node-postgres": "node-postgres-compat",
              }
              linux_cases = [
                  c for c in linux_cases
                  if (case_filter in c["case"]) or (case_filter in alias_map.get(c["case"], ""))
              ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for k, v in flags.items():
                  out.write(f"{k}={'true' if v else 'false'}\n")
              out.write(f"linux_matrix={json.dumps(linux_cases, separators=(',', ':'))}\n")
              out.write(f"has_linux_compat={'true' if linux_cases else 'false'}\n")
          PY

  docs-only:
    # Stand-in check so a docs-only PR still reports a green status instead of
    # dangling "expected" checks.
    name: docs-example-only
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Diff touches no Rust/TS/bundle/workflow paths."
          echo "Heavy Rust + compat jobs skipped."

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('rust-fmt', inputs.case_filter))
    name: rust-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  napi-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('napi-clippy', inputs.case_filter))
    name: napi-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: cargo-registry
          cache-targets: "false"
      - run: >
          cargo clippy
          -p lexe_napi
          -p lexe_events
          -p lexe_tty
          -p lexe_modules
          -p lexe_webassembly
          -p lexe_fs
          -p lexe_util
          -p lexe_sqlite
          --all-targets --no-deps -- -D warnings

  v8-abi:
    needs: changes
    if: needs.changes.outputs.v8 == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('v8-abi-drift', inputs.case_filter))
    name: v8-abi-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
      - run: bash v8_compat/tools/check_abi.sh

  v8-clippy:
    needs: changes
    if: needs.changes.outputs.v8 == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('v8-clippy', inputs.case_filter))
    name: v8-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: cargo-registry
          cache-targets: "false"
      - run: cargo clippy -p v8_compat --all-targets -- -D warnings

  rust-crate-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('rust-crate-tests rust-unit-tests', inputs.case_filter))
    name: rust-crate-tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Fetch Node 24.3 source
        if: needs.changes.outputs.v8 == 'true'
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: rust-crate-tests
          cache-workspace-crates: "true"
          cache-on-failure: "true"
      - if: needs.changes.outputs.v8 == 'true'
        run: cargo test -p v8_compat --lib
      - run: >
          cargo test
          -p lexe_events
          -p lexe_tty
          -p lexe_modules
          -p lexe_webassembly
          -p lexe_util
          -p lexe_fs
          --lib
      - run: cargo test -p lexe_napi --lib -- --test-threads=1
      - run: cargo test -p lexe_sqlite --all-targets

  build-linux:
    needs: changes
    if: needs.changes.outputs.core == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || needs.changes.outputs.has_linux_compat == 'true' || contains('build-linux js-unit-gates rust-unit-tests', inputs.case_filter))
    name: build-linux & js-unit-gates
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Fetch Node 24.3 source
        if: needs.changes.outputs.v8 == 'true'
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: build-linux-${{ needs.changes.outputs.v8 == 'true' && 'v8' || 'napi' }}
          cache-workspace-crates: "true"
          cache-on-failure: "true"
      - name: Build lexe (once for Linux gates and compat)
        run: |
          if [ "${{ needs.changes.outputs.v8 }}" = "true" ]; then
            cargo build -p lexe --features v8-compat
            nm -D --defined-only target/debug/lexe |
              c++filt |
              grep -F "v8::Isolate::GetCurrent()"
            nm -D --defined-only target/debug/lexe |
              c++filt |
              grep -F "v8::Context::GetIsolate()"
          else
            cargo build -p lexe --features napi
          fi
      - name: JS unit gates
        env:
          LEXE_ASYNC_HOOKS: "1"
        run: |
          for filter in events readline util module fs sqlite worker_threads child_process executable webassembly wasi; do
            ./target/debug/lexe test -d bundle/js/__tests__/unit --filter "$filter"
          done
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.has_linux_compat == 'true'
        with:
          name: lexe-linux-x64
          path: target/debug/lexe
          retention-days: 1
          compression-level: 1

  linux-compat:
    needs: [changes, build-linux]
    if: needs.changes.outputs.has_linux_compat == 'true'
    name: ${{ matrix.case }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: lexe-linux-x64
          path: target/debug
      - name: Run compatibility fixture
        env:
          COMPAT_VP_VERSION_LOOPS: ${{ matrix.case == 'vite-plus' && '100' || '0' }}
          COMPAT_VP_BUILD_LOOPS: ${{ matrix.case == 'vite-plus' && '20' || '0' }}
          COMPAT_SQLITE_LIFECYCLE_LOOPS: ${{ matrix.case == 'node-sqlite' && '100' || '0' }}
          COMPAT_SQLITE_BACKUP_LOOPS: ${{ matrix.case == 'node-sqlite' && '20' || '0' }}
          COMPAT_BETTER_SQLITE3_LOOPS: ${{ matrix.case == 'better-sqlite3' && '20' || '0' }}
        run: |
          chmod +x target/debug/lexe
          ./target/debug/lexe --version
          export LEXE_BIN="$PWD/target/debug/lexe"
          case "${{ matrix.case }}" in
            mysql2|node-postgres|next|vite-plus|better-sqlite3)
              (cd "compat/${{ matrix.case }}" && yarn install --frozen-lockfile)
              ;;
            v8-hello)
              (cd compat/v8-hello && npm run build)
              ;;
            node-sqlite)
              ;;
          esac
          node compat/run.mjs "${{ matrix.case }}" target/debug/lexe
          if [ "${{ matrix.case }}" = "api-surface" ]; then
            node scripts/check-compat-matrix.mjs
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.case }}-ubuntu-latest-logs
          path: |
            compat/${{ matrix.case }}/compat.log
            compat/${{ matrix.case }}/.next
            compat/${{ matrix.case }}/dist
          if-no-files-found: ignore

  windows-sqlite:
    needs: changes
    if: needs.changes.outputs.sqlite == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('windows-sqlite', inputs.case_filter))
    name: windows-sqlite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: windows-sqlite
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - name: Build lexe and sqlite extension
        run: |
          cargo build -p lexe
          $env:CC = "clang"
          node compat/node-sqlite/build-extension.mjs
          Remove-Item Env:CC
          if (-not (Test-Path compat/node-sqlite/build/sqlite_extension.dll)) {
            throw "missing compat/node-sqlite/build/sqlite_extension.dll"
          }
      - name: JS sqlite unit tests
        run: ./target/debug/lexe.exe test -d bundle/js/__tests__/unit --filter sqlite
      - name: Parity differential (Lexe only on Windows CI)
        env:
          COMPAT_SKIP_NODE_BASELINE: "1"
          COMPAT_SQLITE_LIFECYCLE_LOOPS: "5"
          COMPAT_SQLITE_BACKUP_LOOPS: "2"
        run: node compat/run.mjs node-sqlite target/debug/lexe.exe

  windows-tty-napi:
    needs: changes
    if: needs.changes.outputs.windows_crates == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('windows-tty-napi', inputs.case_filter))
    name: windows-tty-napi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: windows-tty-napi
      - name: Build and test TTY + N-API + FS (Windows)
        run: |
          cargo test -p lexe_tty --lib
          cargo test -p lexe_napi --lib -- --test-threads=1
          cargo test -p lexe_fs --lib
          cargo clippy -p lexe_fs -p lexe_napi --all-targets --no-deps -- -D warnings
          cargo build -p lexe --features napi

  sanitizer:
    needs: changes
    if: needs.changes.outputs.v8 == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('sanitizer-address sanitizer-undefined', inputs.case_filter))
    name: sanitizer-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.case_filter == 'sanitizer-address' && '["address"]' || github.event_name == 'workflow_dispatch' && inputs.case_filter == 'sanitizer-undefined' && '["undefined"]' || '["address","undefined"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.sanitizer == 'address' && 'nightly' || env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: sanitizer-${{ matrix.sanitizer }}
          cache-targets: "false"
      - name: Run sanitizer gate
        run: bash v8_compat/tools/run_sanitizer_ci.sh ${{ matrix.sanitizer }}

  sqlite-asan:
    needs: changes
    if: needs.changes.outputs.sqlite == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('sqlite-asan', inputs.case_filter))
    name: sqlite-asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - uses: dtolnay/rust-toolchain@nightly
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: sqlite-asan
          cache-targets: "false"
      - run: yarn install --frozen-lockfile
      - run: bash compat/node-sqlite/run-asan.sh

  macos-compat-node22:
    needs: changes
    if: needs.changes.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('macos-compat-node22 napi-hello vite-plus', inputs.case_filter))
    name: macos-compat-node22 (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: compatibility
          key: macos-latest-napi
      - run: cargo build -p lexe --features napi
      - name: Run napi-hello and vite-plus
        env:
          COMPAT_VP_VERSION_LOOPS: "100"
          COMPAT_VP_BUILD_LOOPS: "20"
        run: |
          export LEXE_BIN="$PWD/target/debug/lexe"
          "$LEXE_BIN" --version
          (cd compat/napi-hello && yarn install)
          node compat/run.mjs napi-hello target/debug/lexe
          (cd compat/vite-plus && yarn install --frozen-lockfile)
          node compat/run.mjs vite-plus target/debug/lexe
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-macos-node22-logs
          path: |
            compat/napi-hello/compat.log
            compat/vite-plus/compat.log
            compat/vite-plus/dist
          if-no-files-found: ignore

  macos-compat-node24:
    needs: changes
    if: needs.changes.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('macos-compat-node24 node-sqlite v8-hello better-sqlite3', inputs.case_filter))
    name: macos-compat-node24 (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: compatibility
          key: macos-latest-v8-compat
      - run: cargo build -p lexe --features v8-compat
      - name: Run node-sqlite, v8-hello, and better-sqlite3
        env:
          COMPAT_SQLITE_LIFECYCLE_LOOPS: "100"
          COMPAT_SQLITE_BACKUP_LOOPS: "20"
          COMPAT_BETTER_SQLITE3_LOOPS: "20"
        run: |
          export LEXE_BIN="$PWD/target/debug/lexe"
          "$LEXE_BIN" --version
          node compat/run.mjs node-sqlite target/debug/lexe
          (cd compat/v8-hello && npm run build)
          node compat/run.mjs v8-hello target/debug/lexe
          (cd compat/better-sqlite3 && yarn install --frozen-lockfile)
          node compat/run.mjs better-sqlite3 target/debug/lexe
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-macos-node24-logs
          path: |
            compat/node-sqlite/compat.log
            compat/v8-hello/compat.log
            compat/better-sqlite3/compat.log
          if-no-files-found: ignore

  arm64-compat:
    needs: changes
    if: needs.changes.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('arm64-compat v8-hello better-sqlite3', inputs.case_filter))
    name: arm64-compat (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: compatibility
          key: ubuntu-24.04-arm-v8-compat
      - name: Build lexe (v8-compat)
        run: |
          cargo build -p lexe --features v8-compat
          nm -D --defined-only target/debug/lexe |
            c++filt |
            grep -F "v8::Isolate::GetCurrent()"
          nm -D --defined-only target/debug/lexe |
            c++filt |
            grep -F "v8::Context::GetIsolate()"
      - name: Run v8-hello and better-sqlite3
        env:
          COMPAT_BETTER_SQLITE3_LOOPS: "20"
        run: |
          export LEXE_BIN="$PWD/target/debug/lexe"
          "$LEXE_BIN" --version
          (cd compat/v8-hello && npm run build)
          node compat/run.mjs v8-hello target/debug/lexe
          (cd compat/better-sqlite3 && yarn install --frozen-lockfile)
          node compat/run.mjs better-sqlite3 target/debug/lexe
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-arm64-logs
          path: |
            compat/v8-hello/compat.log
            compat/better-sqlite3/compat.log
          if-no-files-found: ignore

  npm-package:
    name: npm-package
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.case_filter == '' || contains('npm-package', inputs.case_filter)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
      - name: Verify npm CLI wrapper and lexe-types packaging
        run: |
          make npm-pack-check
          make npm-test
          make types-pack-check
