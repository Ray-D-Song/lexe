name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  RUST_TOOLCHAIN: "1.100.0"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require tag to match Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' lexe/Cargo.toml)
          test -n "$version"
          test "$RELEASE_TAG" = "v$version" || {
            echo "tag $RELEASE_TAG must equal v$version" >&2
            exit 1
          }

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: lexe-linux-x64-gnu
            platform: linux
            arch: x64
            libc: gnu
            zig: true
            rustflags: "-Ctarget-cpu=haswell -Cpanic=abort"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: lexe-linux-arm64-gnu
            platform: linux
            arch: arm64
            libc: gnu
            zig: true
            rustflags: "-Ctarget-cpu=neoverse-n1 -Cpanic=abort"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: lexe-linux-x64-musl
            platform: linux
            arch: x64
            libc: musl
            zig: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: lexe-linux-arm64-musl
            platform: linux
            arch: arm64
            libc: musl
            zig: true
          # Cross-compiled on the arm64 runner: Intel macOS runners queue far longer.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: lexe-macos-x64
            platform: darwin
            arch: x64
            zig: false
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: lexe-macos-arm64
            platform: darwin
            arch: arm64
            zig: false
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: lexe-windows-x64.exe
            platform: win32
            arch: x64
            zig: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: lexe-windows-arm64.exe
            platform: win32
            arch: arm64
            zig: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-build
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild
        if: matrix.libc == 'gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Configure Linux musl linkers
        if: matrix.zig && matrix.libc == 'musl'
        shell: bash
        run: |
          echo "CC_aarch64_unknown_linux_musl=$GITHUB_WORKSPACE/linker/cc-aarch64-linux-musl" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_musl=$GITHUB_WORKSPACE/linker/cxx-aarch64-linux-musl" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=$GITHUB_WORKSPACE/linker/ar" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=$GITHUB_WORKSPACE/linker/cc-x86_64-linux-musl" >> "$GITHUB_ENV"
          echo "CXX_x86_64_unknown_linux_musl=$GITHUB_WORKSPACE/linker/cxx-x86_64-linux-musl" >> "$GITHUB_ENV"
          echo "AR_x86_64_unknown_linux_musl=$GITHUB_WORKSPACE/linker/ar" >> "$GITHUB_ENV"
      - run: make js
      - name: Build release binary (glibc 2.28 baseline)
        if: matrix.libc == 'gnu'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo zigbuild --locked --release -p lexe --target ${{ matrix.target }}.2.28
      - name: Build release binary (static musl)
        if: matrix.libc == 'musl'
        run: cargo build --locked --release -p lexe --target ${{ matrix.target }}
      - name: Build release binary (macOS and Windows)
        if: matrix.libc == ''
        run: cargo build --locked --release -p lexe --target ${{ matrix.target }}
      - name: Verify libc linkage and glibc baseline
        if: matrix.libc == 'gnu'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/lexe"
          test -s "$bin"
          # glibc baseline: no symbol version above 2.28 may be required.
          max=$(readelf -W --dyn-syms "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest required glibc symbol version: $max"
          top=$(printf '%s\n' "$max" "GLIBC_2.28" | sort -V | tail -1)
          test "$top" = "GLIBC_2.28" || { echo "glibc baseline exceeded: $max" >&2; exit 1; }
          # Native addons resolve napi_* from the executable, so they must be exported dynamically.
          nm -D --defined-only "$bin" | grep -q ' T napi_create_string_utf8' || {
            echo "napi_create_string_utf8 is not exported" >&2; exit 1; }
          # Dynamically linked: must depend on glibc, not be static.
          readelf -d "$bin" | grep -q 'NEEDED.*libc.so.6' || { echo "expected dynamic glibc linkage" >&2; exit 1; }
      - name: Verify musl binary is static
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/lexe"
          test -s "$bin"
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "musl build unexpectedly has dynamic dependencies" >&2; exit 1
          fi
      - name: Smoke test on baseline distro (glibc 2.28 / musl)
        if: matrix.libc != ''
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/lexe"
          if [ "${{ matrix.libc }}" = "gnu" ]; then
            # Debian buster ships glibc 2.28: the binary must run there.
            docker run --rm -v "$PWD/$bin:/lexe:ro" debian:buster /lexe --version
          else
            docker run --rm -v "$PWD/$bin:/lexe:ro" alpine:3.20 /lexe --version
          fi
      - name: Install Rosetta 2 for x86_64 smoke test
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Verify binary and stage release asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/lexe${{ endsWith(matrix.asset, '.exe') && '.exe' || '' }}" "${{ matrix.asset }}"
          expected="lexe v${RELEASE_TAG#v} (${{ matrix.platform }}, ${{ matrix.arch }})"
          test "$(./${{ matrix.asset }} --version)" = "$expected"
          smoke_tmp=$(mktemp -d)
          printf 'console.log("smoke-ok", process.argv[1]);\n' > "$smoke_tmp/app.js"
          smoke_out="$smoke_tmp/app${{ endsWith(matrix.asset, '.exe') && '.exe' || '' }}"
          ./${{ matrix.asset }} compile "$smoke_tmp/app.js" "$smoke_out" --executable
          test "$("$smoke_out" arg1)" = "smoke-ok arg1"
          rm -rf "$smoke_tmp"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          awk -v version="${RELEASE_TAG#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release/RELEASE_NOTES.md
          test -s release/RELEASE_NOTES.md
          cd release
          sha256sum lexe-* > SHA256SUMS
          prerelease=()
          [[ "$RELEASE_TAG" == *-* ]] && prerelease+=(--prerelease)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --notes-file RELEASE_NOTES.md "${prerelease[@]}"
          else
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" lexe-* SHA256SUMS --clobber

  publish-npm:
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: lexe-linux-*
          merge-multiple: true
      - name: Stage and validate npm packages
        shell: bash
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          (cd npm && npm pkg set version="$RELEASE_VERSION")
          (cd types && npm pkg set version="$RELEASE_VERSION")
          cp LICENSE npm/LICENSE
          cp LICENSE types/LICENSE
          node npm/scripts/stage-linux-packages.mjs release "$RELEASE_VERSION"
          node npm/scripts/pack-check.mjs
          node --test npm/test/npm-cli.test.mjs
          node types/scripts/pack-check.mjs
      - name: Smoke test npm CLI against GitHub Release
        shell: bash
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          expected="lexe v${RELEASE_VERSION} (linux, x64)"
          smoke_cache=$(mktemp -d)
          trap 'rm -rf "$smoke_cache"' EXIT
          actual=""
          for attempt in 1 2 3; do
            if actual=$(LEXE_CACHE_DIR="$smoke_cache" node npm/bin/lexe.mjs --version); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Live npm CLI smoke test failed after 3 attempts" >&2
              exit 1
            fi
            sleep 3
          done
          test "$actual" = "$expected" || {
            echo "Expected '$expected', got '$actual'" >&2
            exit 1
          }
          rm -rf npm/vendor
      - name: Publish lexe and lexe-types to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish to npm" >&2
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          tag_args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            pre="${RELEASE_VERSION#*-}"
            dist_tag="${pre%%.*}"
            if [[ -z "$dist_tag" || ! "$dist_tag" =~ ^[a-zA-Z0-9-]+$ ]]; then
              dist_tag="next"
            fi
            tag_args=(--tag "$dist_tag")
          fi
          # Subpackages first: the main lexe package's optionalDependencies must resolve on install.
          for dir in npm/packages/linux-x64-gnu npm/packages/linux-arm64-gnu npm/packages/linux-x64-musl npm/packages/linux-arm64-musl npm types; do
            pkg=$(node -p "require('./$dir/package.json').name")
            published=$(npm view "${pkg}@${RELEASE_VERSION}" version 2>/dev/null || true)
            if [ "$published" = "$RELEASE_VERSION" ]; then
              echo "Skipping ${pkg}@${RELEASE_VERSION} (already published)"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public "${tag_args[@]}")
          done
